apply plugin: 'application'

application { mainClass = 'xyz.stormclient.launcher.StormLauncher' }

dependencies {
    implementation project(':storm-core')
}

jar {
    archiveBaseName = 'storm-launcher'
    manifest { attributes 'Main-Class': 'xyz.stormclient.launcher.StormLauncher' }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
