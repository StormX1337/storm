# Deobfuscating Minecraft is the most memory hungry thing in this project, and
# Gradle 4 defaults to a heap far below what it needs. Raise it here rather
# than finding out through "GC overhead limit exceeded".
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
