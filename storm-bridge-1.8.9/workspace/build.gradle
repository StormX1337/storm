// ============================================================
//  Build for the Minecraft 1.8.9 bridge.
//
//  Self contained on purpose. ForgeGradle 2.1 is the toolchain
//  that deobfuscates 1.8.9, it needs an old Gradle and Java 8,
//  and neither can build the rest of Storm. So this folder
//  has its own wrapper and is never part of the root build.
//
//  Run it through build-bridge.ps1, which finds a JDK 8
//  for you and passes the right Gradle and ForgeGradle
//  versions.
//
//  The result is build\libs\storm-bridge-1.8.9.jar, which goes
//  next to storm-agent.jar in dist\.
// ============================================================
// ForgeGradle is tied to a narrow range of Minecraft versions, and 2.3 already
// refuses anything below 1.12. The pairing that covers 1.8.9 is 2.1.
//
//   ForgeGradle 1.2   ->  1.7.10
//   ForgeGradle 2.1   ->  1.8 .. 1.8.9      <- this workspace
//   ForgeGradle 2.2   ->  1.9, 1.10
//   ForgeGradle 2.3   ->  1.11, 1.12
//
// Override without editing this file:
//   .\build-bridge.ps1 -ForgeGradle 2.2-SNAPSHOT
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        // jcenter is gone, so nothing here may rely on it
        classpath "net.minecraftforge.gradle:ForgeGradle:${project.hasProperty('fgVersion') ? project.fgVersion : '2.1-SNAPSHOT'}"
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

group = 'xyz.stormclient'
version = '1.0.0'
archivesBaseName = 'storm-bridge-1.8.9'

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    mappings = 'stable_22'
    runDir = 'run'
}

sourceSets {
    main {
        java {
            srcDirs = ['../src/main/java']
            // The mixins need the Mixin toolchain on top of ForgeGradle. Without
            // them the Forge event hooks still cover ticks, rendering, packets,
            // chat and input; see BRIDGE-BUILD.md for what stays inactive.
            exclude '**/mixin/**'
        }
        resources {
            srcDirs = ['../src/main/resources']
            exclude 'mixins.storm.json'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // storm-core, already inside the agent jar the main build produces
    compileOnly files('../../dist/storm-agent.jar')
}

jar {
    archiveName = 'storm-bridge-1.8.9.jar'
    manifest {
        attributes 'Storm-Bridge': '1.8.9', 'Storm-Version': version
    }
}

processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.8.9'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
    duplicatesStrategy = 'exclude'
}

// The bridge jar carries only bridge classes. Everything else comes from the
// agent jar at runtime, so nothing is on the class path twice.
