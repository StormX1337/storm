# Storm licence server
#
# Copy to /opt/storm-licences/storm-licences.properties and fill in.
# Paths here are relative to this file, not to the working directory.

# Keep this on the loopback address and let nginx handle TLS. Binding to
# 0.0.0.0 would serve plain HTTP to the internet, and the admin token travels
# in a header.
host = 127.0.0.1
port = 8710

# Where issued keys are kept, and the RSA key that signs licences.
# Back both up. Losing the private key means reissuing every licence.
store      = licences.json
privateKey = licence-private.key

# Opens /api/issue, /api/revoke, /api/unbind and /api/keys.
# Generate one with:  head -c 32 /dev/urandom | base64
# Must be at least 24 characters; the server refuses to start otherwise.
adminToken =

# How long a signed licence lasts before the launcher has to ask again.
# This is the revocation window: a key you revoke stops working within this
# many days, and the client keeps working this long if the server is down.
# 0 signs licences that last as long as the purchase, which means a revoked
# key is never actually cut off.
leaseDays = 7

# nginx must set X-Forwarded-For to $remote_addr (not $proxy_add_x_forwarded_for),
# otherwise a caller can spoof the header and walk around the rate limit.
# Set this to false when nothing sits in front of the server.
behindProxy = true

# Token bucket per caller on the public endpoints.
rateBurst     = 20
ratePerSecond = 0.5

# ---- payments ------------------------------------------------------
# From the Stripe dashboard, Developers > Webhooks > your endpoint.
# Leave empty to turn the webhook off entirely.
stripeWebhookSecret =

# Plan given to a checkout that carries no "plan" in its metadata.
defaultPlan = pro

# How many days each plan lasts. 0 never expires.
plan.pro      = 30
plan.year     = 365
plan.lifetime = 0
